# Límites de riesgo. El modelo NO puede modificar este archivo ni estos valores.
risk_per_trade_pct: 0.25
max_daily_loss_pct: 1.0           # sobre el equity al comienzo del día
max_open_positions: 1
max_total_drawdown_pct: 10.0      # al superarlo se bloquean nuevas entradas
max_consecutive_losses: 6         # pausa hasta el día siguiente
max_execution_errors: 3           # errores seguidos => bloqueo
max_spread_multiple: 3.0          # spread actual > 3x mediana reciente => no operar
max_spread_points_abs: 1500       # 15 puntos de índice
cost_buffer_multiple: 1.0         # añade 1x (spread+deslizamiento) a la pérdida estimada al stop
allow_martingale: false
allow_hedging: false
